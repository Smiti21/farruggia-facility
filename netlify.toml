[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app uses BrowserRouter, so every path has to resolve to index.html.
# Without this a visitor hitting anything other than "/" gets a 404 from Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these filenames, so they can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The background video is the single biggest asset. A week of caching means
# repeat visitors never re-download it, while still allowing a swap to land.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
